<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">

  <title>DILEMA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #0b0b0b;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px 30px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* ---------- INICIO ---------- */

    #home {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      margin-bottom: 70px;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .actions {
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin-bottom: 14px;

      border-radius: 14px;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;

      cursor: pointer;
    }

    .btn-primary {
      background: #ffffff;
      color: #0b0b0b;
      border: 1px solid #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid #444444;
    }

    .version {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;

      text-align: center;
      color: #555555;

      font-size: 11px;
      letter-spacing: 2px;
    }

    /* ---------- PERFIL ---------- */

    #profile {
      justify-content: center;
    }

    .back {
      position: absolute;
      top: 28px;

      background: transparent;
      border: 0;
      color: #777777;

      font-size: 28px;
      cursor: pointer;
    }

    .title {
      margin-bottom: 8px;

      text-align: center;
      font-size: 30px;
      font-weight: 900;
    }

    .subtitle {
      margin-bottom: 42px;

      text-align: center;
      color: #777777;

      font-size: 14px;
    }

    .name-input {
      width: 100%;
      margin-bottom: 34px;
      padding: 17px;

      background: transparent;
      color: #ffffff;

      border: 1px solid #444444;
      border-radius: 14px;

      outline: none;

      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .name-input:focus {
      border-color: #ffffff;
    }

    .avatar-label {
      margin-bottom: 18px;

      text-align: center;
      color: #777777;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .avatars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;

      margin-bottom: 38px;
    }

    .avatar {
      aspect-ratio: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;

      border: 1px solid #333333;
      border-radius: 50%;

      font-size: 31px;

      cursor: pointer;
    }

    .avatar.selected {
      background: #ffffff;
      border-color: #ffffff;
    }

    .continue-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    /* ---------- SALA PROVISIONAL ---------- */

    #room {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .chosen-avatar {
      margin-bottom: 18px;
      font-size: 64px;
    }

    .player-name {
      margin-bottom: 10px;

      font-size: 30px;
      font-weight: 900;
    }

    .room-message {
      color: #777777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <!-- PANTALLA 1 · INICIO -->

  <main id="home" class="screen active">

    <div class="logo">
      DILEMA
    </div>

    <div class="actions">

      <button class="btn btn-primary" onclick="openProfile()">
        CREAR PARTIDA
      </button>

      <button class="btn btn-secondary">
        UNIRME A UNA PARTIDA
      </button>

    </div>

    <div class="version">
      V0.0.1
    </div>

  </main>


  <!-- PANTALLA 2 · IDENTIDAD DE PARTIDA -->

  <section id="profile" class="screen">

    <button class="back" onclick="goHome()">
      ←
    </button>

    <div class="title">
      ¿QUIÉN ERES?
    </div>

    <div class="subtitle">
      Solo para esta partida.
    </div>

    <input
      id="playerName"
      class="name-input"
      type="text"
      maxlength="16"
      placeholder="TU NOMBRE"
      autocomplete="off"
      oninput="checkProfile()"
    >

    <div class="avatar-label">
      ELIGE AVATAR
    </div>

    <div class="avatars">

      <button class="avatar" onclick="selectAvatar(this, '😈')">😈</button>
      <button class="avatar" onclick="selectAvatar(this, '🤡')">🤡</button>
      <button class="avatar" onclick="selectAvatar(this, '💀')">💀</button>
      <button class="avatar" onclick="selectAvatar(this, '👽')">👽</button>

      <button class="avatar" onclick="selectAvatar(this, '🦍')">🦍</button>
      <button class="avatar" onclick="selectAvatar(this, '🐸')">🐸</button>
      <button class="avatar" onclick="selectAvatar(this, '🦆')">🦆</button>
      <button class="avatar" onclick="selectAvatar(this, '🦄')">🦄</button>

    </div>

    <button
      id="continueBtn"
      class="btn btn-primary continue-btn"
      onclick="createRoom()"
      disabled
    >
      CONTINUAR
    </button>

  </section>


  <!-- PANTALLA 3 · SALA PROVISIONAL -->

  <section id="room" class="screen">

    <div id="chosenAvatar" class="chosen-avatar"></div>

    <div id="displayName" class="player-name"></div>

    <div class="room-message">
      PARTIDA CREADA
      <br>
      <br>
      Próximo paso:
      <br>
      crear la sala y conectar jugadores.
    </div>

  </section>


  <script>
    let selectedAvatar = "";

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(screenId).classList.add("active");
    }

    function openProfile() {
      showScreen("profile");
    }

    function goHome() {
      showScreen("home");
    }

    function selectAvatar(button, avatar) {
      selectedAvatar = avatar;

      document.querySelectorAll(".avatar").forEach(item => {
        item.classList.remove("selected");
      });

      button.classList.add("selected");

      checkProfile();
    }

    function checkProfile() {
      const playerName =
        document.getElementById("playerName").value.trim();

      document.getElementById("continueBtn").disabled =
        playerName.length === 0 || selectedAvatar === "";
    }

    function createRoom() {
      const playerName =
        document.getElementById("playerName").value.trim();

      document.getElementById("chosenAvatar").textContent =
        selectedAvatar;

      document.getElementById("displayName").textContent =
        playerName;

      showScreen("room");
    }
  </script>

</body>
</html>
