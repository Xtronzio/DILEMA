<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">

  <title>DILEMA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #0b0b0b;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px 30px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      margin-bottom: 70px;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .actions {
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .btn-primary {
      background: #ffffff;
      color: #0b0b0b;
      border: 1px solid #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid #444444;
    }

    .btn-danger {
      background: transparent;
      color: #ff6b6b;
      border: 1px solid #4a2222;
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .version {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #555555;
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    .back {
      position: absolute;
      top: 28px;
      background: transparent;
      border: 0;
      color: #777777;
      font-size: 28px;
      cursor: pointer;
    }

    .title {
      margin-bottom: 8px;
      text-align: center;
      font-size: 30px;
      font-weight: 900;
    }

    .subtitle {
      margin-bottom: 34px;
      text-align: center;
      color: #777777;
      font-size: 14px;
      line-height: 1.5;
    }

    .text-input {
      width: 100%;
      margin-bottom: 20px;
      padding: 17px;
      background: transparent;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 14px;
      outline: none;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .text-input:focus {
      border-color: #ffffff;
    }

    .room-code-input {
      text-transform: uppercase;
      letter-spacing: 8px;
      font-size: 28px;
      font-weight: 900;
    }

    .avatar-label {
      margin: 8px 0 14px;
      text-align: center;
      color: #777777;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .avatar-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .avatar-tabs::-webkit-scrollbar {
      display: none;
    }

    .avatar-tab {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid #333333;
      background: #151515;
      color: #777777;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .avatar-tab.active {
      background: #ffffff;
      color: #0b0b0b;
      border-color: #ffffff;
    }

    .avatars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .avatar {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #151515;
      border: 1px solid #333333;
      border-radius: 50%;
      font-size: 28px;
      cursor: pointer;
    }

    .avatar.selected {
      background: #ffffff;
      border-color: #ffffff;
    }

    .error {
      min-height: 22px;
      margin-bottom: 14px;
      color: #999999;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }

    .room-code-label {
      margin-bottom: 8px;
      color: #777777;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .room-code {
      margin-bottom: 38px;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 10px;
    }

    .room-status {
      margin-bottom: 28px;
      color: #777777;
      font-size: 13px;
    }

    .players-title {
      width: 100%;
      margin-bottom: 12px;
      text-align: left;
      color: #777777;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .players-list {
      width: 100%;
      margin-bottom: 28px;
    }

    .player-card {
      width: 100%;
      padding: 14px 4px;
      border-bottom: 1px solid #222222;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .player-card.own-card {
      cursor: pointer;
    }

    .player-card.own-card:active {
      opacity: 0.75;
    }

    .player-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #151515;
      font-size: 27px;
    }

    .player-info {
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-size: 17px;
      font-weight: 900;
    }

    .player-motto {
      margin-top: 4px;
      color: #777777;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .host-badge {
      margin-left: auto;
      color: #555555;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .edit-hint {
      margin-left: auto;
      color: #555555;
      font-size: 18px;
    }

    .small-note {
      margin-top: 8px;
      color: #555555;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .profile-preview {
      margin-bottom: 24px;
      text-align: center;
    }

    .profile-preview-avatar {
      font-size: 58px;
      margin-bottom: 10px;
    }

    .profile-preview-name {
      font-size: 24px;
      font-weight: 900;
    }

    .profile-preview-motto {
      margin-top: 5px;
      color: #777777;
      font-size: 13px;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 16px 0 20px;
      background: #222222;
    }
  </style>
</head>

<body>

  <!-- INICIO -->

  <main id="home" class="screen active center">

    <div class="logo">DILEMA</div>

    <div class="actions">

      <button class="btn btn-primary" onclick="startCreateFlow()">
        CREAR PARTIDA
      </button>

      <button class="btn btn-secondary" onclick="openJoinScreen()">
        UNIRME A UNA PARTIDA
      </button>

    </div>

    <div class="version">
      V0.0.3
    </div>

  </main>


  <!-- INTRODUCIR CÓDIGO -->

  <section id="join" class="screen center">

    <button class="back" onclick="goHome()">←</button>

    <div class="title">
      ENTRAR
    </div>

    <div class="subtitle">
      Introduce el código de la partida.
    </div>

    <input
      id="joinCode"
      class="text-input room-code-input"
      type="text"
      maxlength="4"
      placeholder="----"
      autocomplete="off"
      oninput="formatJoinCode()"
    >

    <div id="joinError" class="error"></div>

    <button
      id="findRoomBtn"
      class="btn btn-primary"
      onclick="findRoom()"
    >
      CONTINUAR
    </button>

  </section>


  <!-- PERFIL DE PARTIDA -->

  <section id="profile" class="screen">

    <button class="back" onclick="backFromProfile()">←</button>

    <div class="title" id="profileTitle">
      ¿QUIÉN ERES?
    </div>

    <div class="subtitle" id="profileSubtitle">
      Tu identidad solo para esta partida.
    </div>

    <input
      id="playerName"
      class="text-input"
      type="text"
      maxlength="16"
      placeholder="TU NOMBRE"
      autocomplete="off"
      oninput="checkProfile()"
    >

    <input
      id="playerMotto"
      class="text-input"
      type="text"
      maxlength="50"
      placeholder="TU LEMA (OPCIONAL)"
      autocomplete="off"
    >

    <div class="avatar-label">
      ELIGE AVATAR
    </div>

    <div id="avatarTabs" class="avatar-tabs"></div>

    <div id="avatars" class="avatars"></div>

    <div id="profileError" class="error"></div>

    <button
      id="continueBtn"
      class="btn btn-primary"
      onclick="finishProfile()"
      disabled
    >
      CONTINUAR
    </button>

    <button
      id="leaveRoomBtn"
      class="btn btn-danger"
      onclick="confirmLeaveRoom()"
      style="display:none;"
    >
      ABANDONAR SALA
    </button>

  </section>


  <!-- SALA -->

  <section id="room" class="screen center">

    <div class="room-code-label">
      CÓDIGO DE PARTIDA
    </div>

    <div id="roomCodeDisplay" class="room-code">
      ----
    </div>

    <div id="roomStatus" class="room-status">
      ESPERANDO JUGADORES...
    </div>

    <div class="players-title">
      JUGADORES
    </div>

    <div id="playersList" class="players-list"></div>

    <div class="small-note">
      Toca tu perfil para editarlo.
      <br>
      Abre DILEMA en otro móvil y entra con este código.
    </div>

  </section>


  <script>
    // ---------------------------------------------------
    // SUPABASE
    // ---------------------------------------------------

    const SUPABASE_URL =
      "https://cioydzndfvskzubyjcgs.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_XrqG0cXWS2vlJIa3jw70Ng_33Gftqes";

    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ---------------------------------------------------
    // AVATARES
    // ---------------------------------------------------

    const avatarCategories = {
      "CARAS": [
        "😈","🤡","🤬","🥴","🤪",
        "😎","🤯","🥸","🤠","👹"
      ],

      "ANIMALES": [
        "🦍","🐸","🦆","🐒","🦄",
        "🦖","🦈","🐙","🦝","🦥"
      ],

      "BICHOS": [
        "👽","🤖","👾","💀","👻",
        "🧟","🧛","🧌","🦹","🥷"
      ],

      "COMIDA": [
        "🍆","🍑","🌭","🍕","🍔",
        "🍌","🥒","🌶️","🍩","🧀"
      ],

      "DEPORTE": [
        "⚽","🏀","🏈","🎾","🥊",
        "🏆","🏎️","🚴","🏄","🏋️"
      ],

      "CAOS": [
        "💩","💣","🧨","🖕","🧠",
        "🦠","🪦","🚽","🩲","🔥"
      ]
    };


    // ---------------------------------------------------
    // ESTADO LOCAL
    // ---------------------------------------------------

    let flowMode = null;
    let editingProfile = false;

    let selectedAvatar = "";
    let selectedAvatarCategory = "CARAS";

    let currentRoomId = null;
    let currentRoomCode = null;
    let currentRoomHostId = null;

    let playersChannel = null;

    const localPlayerId =
      getOrCreateLocalPlayerId();


    // ---------------------------------------------------
    // UTILIDADES
    // ---------------------------------------------------

    function getOrCreateLocalPlayerId() {
      let id =
        localStorage.getItem(
          "dilema_local_player_id"
        );

      if (!id) {
        if (
          window.crypto &&
          crypto.randomUUID
        ) {
          id = crypto.randomUUID();
        } else {
          id =
            Date.now().toString(36) +
            Math.random()
              .toString(36)
              .substring(2);
        }

        localStorage.setItem(
          "dilema_local_player_id",
          id
        );
      }

      return id;
    }


    function showScreen(screenId) {
      document
        .querySelectorAll(".screen")
        .forEach(screen => {
          screen.classList.remove("active");
        });

      document
        .getElementById(screenId)
        .classList.add("active");
    }


    function goHome() {
      flowMode = null;
      editingProfile = false;

      document.getElementById("joinError").textContent = "";
      document.getElementById("profileError").textContent = "";

      showScreen("home");
    }


    function setLoading(
      buttonId,
      loading,
      text
    ) {
      const button =
        document.getElementById(buttonId);

      if (!button) return;

      if (loading) {
        button.dataset.originalText =
          button.textContent;

        button.textContent =
          text || "ESPERA...";

        button.disabled = true;
      } else {
        button.textContent =
          button.dataset.originalText ||
          button.textContent;

        button.disabled = false;
      }
    }


    // ---------------------------------------------------
    // AVATARES UI
    // ---------------------------------------------------

    function renderAvatarTabs() {
      const tabs =
        document.getElementById(
          "avatarTabs"
        );

      tabs.innerHTML = "";

      Object.keys(
        avatarCategories
      ).forEach(category => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "avatar-tab" +
          (
            category ===
            selectedAvatarCategory
              ? " active"
              : ""
          );

        button.textContent =
          category;

        button.onclick = () => {
          selectedAvatarCategory =
            category;

          renderAvatarTabs();
          renderAvatars();
        };

        tabs.appendChild(button);
      });
    }


    function renderAvatars() {
      const container =
        document.getElementById(
          "avatars"
        );

      container.innerHTML = "";

      avatarCategories[
        selectedAvatarCategory
      ].forEach(avatarValue => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "avatar" +
          (
            avatarValue ===
            selectedAvatar
              ? " selected"
              : ""
          );

        button.textContent =
          avatarValue;

        button.onclick = () => {
          selectedAvatar =
            avatarValue;

          renderAvatars();
          checkProfile();
        };

        container.appendChild(button);
      });
    }


    // ---------------------------------------------------
    // CREAR PARTIDA
    // ---------------------------------------------------

    function startCreateFlow() {
      flowMode = "create";
      editingProfile = false;

      resetProfile();

      showScreen("profile");
    }


    // ---------------------------------------------------
    // UNIRSE
    // ---------------------------------------------------

    function openJoinScreen() {
      flowMode = "join";
      editingProfile = false;

      document.getElementById("joinCode").value = "";
      document.getElementById("joinError").textContent = "";

      showScreen("join");
    }


    function formatJoinCode() {
      const input =
        document.getElementById(
          "joinCode"
        );

      input.value =
        input.value
          .toUpperCase()
          .replace(
            /[^A-Z0-9]/g,
            ""
          )
          .slice(0, 4);
    }


    async function findRoom() {
      const code =
        document
          .getElementById(
            "joinCode"
          )
          .value
          .trim()
          .toUpperCase();

      const errorBox =
        document.getElementById(
          "joinError"
        );

      errorBox.textContent = "";

      if (code.length !== 4) {
        errorBox.textContent =
          "Introduce un código de 4 caracteres.";
        return;
      }

      setLoading(
        "findRoomBtn",
        true,
        "BUSCANDO..."
      );

      const {
        data,
        error
      } = await sb
        .from("rooms")
        .select(
          "id, code, status, host_id"
        )
        .eq(
          "code",
          code
        )
        .maybeSingle();

      setLoading(
        "findRoomBtn",
        false
      );

      if (error) {
        console.error(error);

        errorBox.textContent =
          "No se ha podido consultar la partida.";
        return;
      }

      if (!data) {
        errorBox.textContent =
          "Esa partida no existe.";
        return;
      }

      currentRoomId =
        data.id;

      currentRoomCode =
        data.code;

      currentRoomHostId =
        data.host_id;

      resetProfile();

      showScreen("profile");
    }


    // ---------------------------------------------------
    // PERFIL
    // ---------------------------------------------------

    function resetProfile() {
      selectedAvatar = "";
      selectedAvatarCategory = "CARAS";

      document.getElementById("playerName").value = "";
      document.getElementById("playerMotto").value = "";
      document.getElementById("profileError").textContent = "";

      document.getElementById("profileTitle").textContent =
        editingProfile
          ? "EDITAR PERFIL"
          : "¿QUIÉN ERES?";

      document.getElementById("profileSubtitle").textContent =
        editingProfile
          ? "Tu identidad en esta sala."
          : "Tu identidad solo para esta partida.";

      document.getElementById("continueBtn").textContent =
        editingProfile
          ? "GUARDAR CAMBIOS"
          : "CONTINUAR";

      document.getElementById("leaveRoomBtn").style.display =
        editingProfile
          ? "block"
          : "none";

      renderAvatarTabs();
      renderAvatars();

      checkProfile();
    }


    function backFromProfile() {
      if (editingProfile) {
        editingProfile = false;
        showScreen("room");
        return;
      }

      if (flowMode === "join") {
        showScreen("join");
      } else {
        goHome();
      }
    }


    function checkProfile() {
      const playerName =
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      document
        .getElementById(
          "continueBtn"
        )
        .disabled =
          playerName.length === 0 ||
          selectedAvatar === "";
    }


    async function finishProfile() {
      if (editingProfile) {
        await updateCurrentPlayer();
        return;
      }

      if (flowMode === "create") {
        await createRoom();
      } else {
        await joinCurrentRoom();
      }
    }


    async function openEditProfile() {
      const {
        data,
        error
      } = await sb
        .from("players")
        .select(
          "name, avatar, motto"
        )
        .eq(
          "room_id",
          currentRoomId
        )
        .eq(
          "player_id",
          localPlayerId
        )
        .maybeSingle();

      if (error || !data) {
        console.error(error);
        return;
      }

      editingProfile = true;

      document.getElementById("playerName").value =
        data.name || "";

      document.getElementById("playerMotto").value =
        data.motto || "";

      selectedAvatar =
        data.avatar || "";

      selectedAvatarCategory =
        findAvatarCategory(
          selectedAvatar
        );

      document.getElementById("profileTitle").textContent =
        "EDITAR PERFIL";

      document.getElementById("profileSubtitle").textContent =
        "Tu identidad en esta sala.";

      document.getElementById("continueBtn").textContent =
        "GUARDAR CAMBIOS";

      document.getElementById("leaveRoomBtn").style.display =
        "block";

      renderAvatarTabs();
      renderAvatars();
      checkProfile();

      showScreen("profile");
    }


    function findAvatarCategory(
      avatar
    ) {
      for (
        const [
          category,
          avatars
        ]
        of Object.entries(
          avatarCategories
        )
      ) {
        if (
          avatars.includes(
            avatar
          )
        ) {
          return category;
        }
      }

      return "CARAS";
    }


    async function updateCurrentPlayer() {
      const name =
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const motto =
        document
          .getElementById(
            "playerMotto"
          )
          .value
          .trim();

      const errorBox =
        document.getElementById(
          "profileError"
        );

      errorBox.textContent = "";

      setLoading(
        "continueBtn",
        true,
        "GUARDANDO..."
      );

      const {
        error
      } = await sb
        .from("players")
        .update({
          name: name,
          avatar:
            selectedAvatar,
          motto:
            motto || null
        })
        .eq(
          "room_id",
          currentRoomId
        )
        .eq(
          "player_id",
          localPlayerId
        );

      setLoading(
        "continueBtn",
        false
      );

      if (error) {
        console.error(error);

        errorBox.textContent =
          "No se ha podido actualizar el perfil.";
        return;
      }

      editingProfile = false;

      await loadPlayers();

      showScreen("room");
    }


    // ---------------------------------------------------
    // SALA
    // ---------------------------------------------------

    function randomRoomCode() {
      const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      let code = "";

      for (
        let i = 0;
        i < 4;
        i++
      ) {
        code +=
          chars[
            Math.floor(
              Math.random() *
              chars.length
            )
          ];
      }

      return code;
    }


    async function generateAvailableCode() {
      for (
        let attempt = 0;
        attempt < 10;
        attempt++
      ) {
        const code =
          randomRoomCode();

        const {
          data,
          error
        } = await sb
          .from("rooms")
          .select("id")
          .eq(
            "code",
            code
          )
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          return code;
        }
      }

      throw new Error(
        "No se pudo generar un código disponible."
      );
    }


    async function createRoom() {
      const errorBox =
        document.getElementById(
          "profileError"
        );

      errorBox.textContent = "";

      setLoading(
        "continueBtn",
        true,
        "CREANDO..."
      );

      try {
        const roomCode =
          await generateAvailableCode();

        const {
          data: room,
          error: roomError
        } = await sb
          .from("rooms")
          .insert({
            code:
              roomCode,
            status:
              "waiting",
            host_id:
              localPlayerId
          })
          .select(
            "id, code, status, host_id"
          )
          .single();

        if (roomError) {
          throw roomError;
        }

        currentRoomId =
          room.id;

        currentRoomCode =
          room.code;

        currentRoomHostId =
          room.host_id;

        await insertCurrentPlayer();

        await enterRoomScreen();

      } catch (error) {
        console.error(error);

        errorBox.textContent =
          "No se ha podido crear la partida.";

      } finally {
        setLoading(
          "continueBtn",
          false
        );

        checkProfile();
      }
    }


    async function joinCurrentRoom() {
      const errorBox =
        document.getElementById(
          "profileError"
        );

      errorBox.textContent = "";

      setLoading(
        "continueBtn",
        true,
        "ENTRANDO..."
      );

      try {
        await insertCurrentPlayer();

        await enterRoomScreen();

      } catch (error) {
        console.error(error);

        errorBox.textContent =
          "No se ha podido entrar en la partida.";

      } finally {
        setLoading(
          "continueBtn",
          false
        );

        checkProfile();
      }
    }


    async function insertCurrentPlayer() {
      const playerName =
        document
          .getElementById(
            "playerName"
          )
          .value
          .trim();

      const playerMotto =
        document
          .getElementById(
            "playerMotto"
          )
          .value
          .trim();

      const {
        error
      } = await sb
        .from("players")
        .insert({
          room_id:
            currentRoomId,
          player_id:
            localPlayerId,
          name:
            playerName,
          avatar:
            selectedAvatar,
          motto:
            playerMotto || null
        });

      if (error) {
        throw error;
      }
    }


    async function enterRoomScreen() {
      document
        .getElementById(
          "roomCodeDisplay"
        )
        .textContent =
          currentRoomCode;

      showScreen("room");

      await loadPlayers();

      subscribeToPlayers();
    }


    async function loadPlayers() {
      const {
        data,
        error
      } = await sb
        .from("players")
        .select(
          "player_id, name, avatar, motto, created_at"
        )
        .eq(
          "room_id",
          currentRoomId
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );

      if (error) {
        console.error(error);
        return;
      }

      renderPlayers(
        data || []
      );
    }


    function renderPlayers(
      players
    ) {
      const list =
        document.getElementById(
          "playersList"
        );

      list.innerHTML = "";

      players.forEach(
        player => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "player-card";

          if (
            player.player_id ===
            localPlayerId
          ) {
            card.classList.add(
              "own-card"
            );

            card.onclick =
              openEditProfile;
          }

          const avatar =
            document.createElement(
              "div"
            );

          avatar.className =
            "player-avatar";

          avatar.textContent =
            player.avatar ||
            "❓";

          const info =
            document.createElement(
              "div"
            );

          info.className =
            "player-info";

          const name =
            document.createElement(
              "div"
            );

          name.className =
            "player-name";

          name.textContent =
            player.name;

          info.appendChild(
            name
          );

          if (
            player.motto
          ) {
            const motto =
              document.createElement(
                "div"
              );

            motto.className =
              "player-motto";

            motto.textContent =
              `“${player.motto}”`;

            info.appendChild(
              motto
            );
          }

          card.appendChild(
            avatar
          );

          card.appendChild(
            info
          );

          if (
            player.player_id ===
            currentRoomHostId
          ) {
            const host =
              document.createElement(
                "div"
              );

            host.className =
              "host-badge";

            host.textContent =
              "CREADOR";

            card.appendChild(
              host
            );
          } else if (
            player.player_id ===
            localPlayerId
          ) {
            const edit =
              document.createElement(
                "div"
              );

            edit.className =
              "edit-hint";

            edit.textContent =
              "⋯";

            card.appendChild(
              edit
            );
          }

          list.appendChild(
            card
          );
        }
      );

      document
        .getElementById(
          "roomStatus"
        )
        .textContent =
          `${players.length} ${
            players.length === 1
              ? "JUGADOR"
              : "JUGADORES"
          }`;
    }


    function subscribeToPlayers() {
      if (
        playersChannel
      ) {
        sb.removeChannel(
          playersChannel
        );
      }

      playersChannel =
        sb
          .channel(
            `room-${currentRoomId}-players`
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "players",
              filter:
                `room_id=eq.${currentRoomId}`
            },
            () => {
              loadPlayers();
            }
          )
          .subscribe();
    }


    // ---------------------------------------------------
    // ABANDONAR SALA
    // ---------------------------------------------------

    async function confirmLeaveRoom() {
      const confirmed =
        window.confirm(
          "¿Abandonar la sala?"
        );

      if (!confirmed) {
        return;
      }

      await leaveRoom();
    }


    async function leaveRoom() {
      try {
        const {
          data: players,
          error:
            playersError
        } = await sb
          .from("players")
          .select(
            "player_id, created_at"
          )
          .eq(
            "room_id",
            currentRoomId
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

        if (
          playersError
        ) {
          throw playersError;
        }

        const remainingPlayers =
          players.filter(
            player =>
              player.player_id !==
              localPlayerId
          );

        const wasHost =
          currentRoomHostId ===
          localPlayerId;

        const {
          error:
            deletePlayerError
        } = await sb
          .from("players")
          .delete()
          .eq(
            "room_id",
            currentRoomId
          )
          .eq(
            "player_id",
            localPlayerId
          );

        if (
          deletePlayerError
        ) {
          throw deletePlayerError;
        }

        if (
          remainingPlayers.length ===
          0
        ) {
          const {
            error:
              deleteRoomError
          } = await sb
            .from("rooms")
            .delete()
            .eq(
              "id",
              currentRoomId
            );

          if (
            deleteRoomError
          ) {
            throw deleteRoomError;
          }

        } else if (
          wasHost
        ) {
          const newHost =
            remainingPlayers[0];

          const {
            error:
              updateRoomError
          } = await sb
            .from("rooms")
            .update({
              host_id:
                newHost.player_id
            })
            .eq(
              "id",
              currentRoomId
            );

          if (
            updateRoomError
          ) {
            throw updateRoomError;
          }
        }

        if (
          playersChannel
        ) {
          sb.removeChannel(
            playersChannel
          );

          playersChannel =
            null;
        }

        currentRoomId =
          null;

        currentRoomCode =
          null;

        currentRoomHostId =
          null;

        editingProfile =
          false;

        goHome();

      } catch (error) {
        console.error(error);

        alert(
          "No se ha podido abandonar la sala."
        );
      }
    }

  </script>
