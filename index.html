<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DILEMA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .claim {
      margin-top: 8px;
      margin-bottom: 70px;
      font-size: 17px;
      letter-spacing: 3px;
      color: #aaaaaa;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .version {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">DILEMA</div>
    <div class="claim">LA DESVERDAD</div>

    <button class="btn primary">
      CREAR PARTIDA
    </button>

    <button class="btn secondary">
      UNIRME A UNA PARTIDA
    </button>

    <div class="version">
      V0.0
    </div>

  </main>

</body>
</html>
