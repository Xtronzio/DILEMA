<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DILEMA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px 30px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .logo {
      margin-bottom: 70px;

      font-size: 52px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .actions {
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin-bottom: 14px;

      border-radius: 14px;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;

      cursor: pointer;
    }

    .btn-primary {
      background: #ffffff;
      color: #0b0b0b;
      border: 1px solid #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid #444444;
    }

    .version {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;

      color: #555555;

      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      DILEMA
    </div>

    <div class="actions">

      <button class="btn btn-primary">
        CREAR PARTIDA
      </button>

      <button class="btn btn-secondary">
        UNIRME A UNA PARTIDA
      </button>

    </div>

    <div class="version">
      V0.0
    </div>

  </main>

</body>

</html>
