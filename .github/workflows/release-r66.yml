name: Publish R66 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-r66.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish private dilemma release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/releases/R66.md?ref=$GITHUB_SHA" --jq .content | base64 --decode > release-notes.md
          if ! gh release view R66 >/dev/null 2>&1; then
            gh release create R66 --target "$GITHUB_SHA" --title "R66 · Historial privado de ayudas" --notes-file release-notes.md
          fi
