name: R98 staging patch

on:
  push:
    branches: [r98-staging]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r98-staging

      - name: Apply R98 front-end patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test-v0.1.16.html')
          text = path.read_text(encoding='utf-8')

          def rep(old, new, expected=1):
              global text
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'R98 patch guard failed: expected {expected} occurrences, found {found}: {old[:100]!r}')
              text = text.replace(old, new)

          rep('DILEMA · V0.1.16-010C-R97', 'DILEMA · V0.1.16-010C-R98')

          rep("{id:'pilotAbsentBtn',drawer:'escape',icon:'◷',name:'AUSENTARME',description:'El debate sigue sin ti. Para volver, la mesa debe aceptar tu solicitud.'}",
              "{id:'pilotAbsentBtn',drawer:'escape',icon:'◷',name:'AUSENTARME',returnShortcut:true,description:'El debate sigue sin ti. Para volver, la mesa debe aceptar tu solicitud.'}")

          rep('actions.filter(a=>a.resource||a.board||a.shortcut)',
              'actions.filter(a=>a.resource||a.board||a.shortcut||a.returnShortcut)', expected=2)

          rep("const show=state?.mine_choice!=='N'&&(action.shortcut?!!source&&!source.disabled:have);\n   b.hidden=!show;if(show)active++;\n   b.disabled=!source||source.disabled;iconLabel(b,action.icon,actionLabel(action));",
              "const locked=typeof r86ActionLocked==='function'&&r86ActionLocked(action.id);\n   const available=!!source&&!source.disabled&&!locked&&(action.returnShortcut?window.dilemaPresenceView?.my_presence==='absent':state?.mine_choice!=='N'&&(action.shortcut||have));\n   b.hidden=!available;if(available)active++;\n   b.disabled=!available;iconLabel(b,action.icon,actionLabel(action));")

          rep("const have=(action.resource||action.board)&&owned(action);card.hidden=have&&window.dilemaBoardSnapshot?.data?.mine_choice!=='N';\n    b.disabled=window.dilemaBoardSnapshot?.data?.mine_choice==='N'&&action.drawer!=='escape'||!source||source.disabled||(action.resource&&!have)||action.id==='pilotSaveSession'&&!window.dilemaBoardSnapshot?.data?.paused;",
              "const state=window.dilemaBoardSnapshot?.round===currentRoundId?window.dilemaBoardSnapshot.data:null;\n    const have=(action.resource||action.board)&&owned(action);\n    const locked=typeof r86ActionLocked==='function'&&r86ActionLocked(action.id);\n    const inInventory=(action.resource||action.board||action.returnShortcut)&&!!source&&!source.disabled&&!locked&&(action.returnShortcut?window.dilemaPresenceView?.my_presence==='absent':state?.mine_choice!=='N'&&have);\n    card.hidden=inInventory;\n    b.disabled=state?.mine_choice==='N'&&action.drawer!=='escape'||!source||source.disabled||locked||(action.resource&&!have)||action.id==='pilotSaveSession'&&!state?.paused;")

          rep("setText(E('r88Empty'),window.dilemaBoardSnapshot?.data?.mine_choice==='N'?'ESTÁS EN DUDA · Elige A o B para activar tus herramientas.':'Aquí aparecen tus herramientas y las acciones disponibles. Puedes usarlas directamente.');",
              "setText(E('r88Empty'),window.dilemaPresenceView?.my_presence==='absent'?'ESTÁS FUERA DEL DEBATE · Cuando puedas regresar, SOLICITAR VOLVER aparecerá aquí automáticamente.':window.dilemaBoardSnapshot?.data?.mine_choice==='N'?'ESTÁS EN DUDA · Elige A o B para activar tus herramientas.':'Aquí aparecen tus herramientas y las acciones disponibles. Puedes usarlas directamente.');")

          lines = text.splitlines(keepends=True)
          replacements = {
              'steal': "  steal:'<svg data-drawer-icon=\"steal\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"#dfad82\" stroke=\"#9f684d\" stroke-width=\"1.2\"/><path d=\"M4.6 9.5c2.6-2.1 5-2.4 7.4-.8 2.4-1.6 4.8-1.3 7.4.8l-1 5c-1.9 1.8-4.1 2-6.4.4-2.3 1.6-4.5 1.4-6.4-.4Z\" fill=\"#7659ff\" stroke=\"#c9c1ff\" stroke-width=\"1\" stroke-linejoin=\"round\"/><ellipse cx=\"8.6\" cy=\"11.6\" rx=\"1.7\" ry=\"1.05\" fill=\"#101010\"/><ellipse cx=\"15.4\" cy=\"11.6\" rx=\"1.7\" ry=\"1.05\" fill=\"#101010\"/><path d=\"M4.8 9.8 2.7 8.6m16.5 1.2 2.1-1.2\" stroke=\"#c9c1ff\" stroke-width=\"1.2\" stroke-linecap=\"round\"/></svg>',\n",
              'bait': "  bait:'<svg data-drawer-icon=\"bait\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"15\" cy=\"4\" r=\"2.2\" fill=\"#c9d6e4\" stroke=\"#6f8196\" stroke-width=\"1.2\"/><path d=\"M15 6v8.1c0 4.2-2.5 6.4-5.6 6.4-3 0-5-2-5-4.8 0-1 .2-1.9.7-2.8\" fill=\"none\" stroke=\"#aebdcd\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"m5.1 12.9.2 4 3.4-2.2\" fill=\"none\" stroke=\"#eef7ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M14.2 7.5v5\" stroke=\"#f5fbff\" stroke-width=\"1\" stroke-linecap=\"round\"/></svg>',\n",
              'mirror': "  mirror:'<svg data-drawer-icon=\"mirror\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"8.7\" rx=\"6.7\" ry=\"6.9\" fill=\"#8cddf0\" stroke=\"#d8a84e\" stroke-width=\"2\"/><ellipse cx=\"12\" cy=\"8.7\" rx=\"4.8\" ry=\"5\" fill=\"#c5f1fa\" stroke=\"none\"/><path d=\"m8.5 9.2 4.2-4.2m-1.6 7.2 4.1-4.1\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><path d=\"M10.7 15.5v5.2c0 .9.6 1.4 1.3 1.4s1.3-.5 1.3-1.4v-5.2\" fill=\"#d8a84e\" stroke=\"#93681f\" stroke-width=\"1.2\"/></svg>',\n",
          }
          for key, new_line in replacements.items():
              hits = [i for i, line in enumerate(lines) if line.startswith(f"  {key}:'<svg data-drawer-icon=")]
              if len(hits) != 1:
                  raise SystemExit(f'R98 icon guard failed for {key}: {len(hits)} lines')
              lines[hits[0]] = new_line
          text = ''.join(lines)

          guards = [
              ('DILEMA · V0.1.16-010C-R98', 1),
              ("returnShortcut:true", 1),
              ("const available=!!source&&!source.disabled&&!locked", 1),
              ("const inInventory=(action.resource||action.board||action.returnShortcut)", 1),
              ('data-drawer-icon="steal"', 1),
              ('data-drawer-icon="bait"', 1),
              ('data-drawer-icon="mirror"', 1),
          ]
          for needle, expected in guards:
              found = text.count(needle)
              if found != expected:
                  raise SystemExit(f'R98 final guard failed: {needle!r}: {found} != {expected}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Static R98 checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('test-v0.1.16.html').read_text(encoding='utf-8')
          if 'V0.1.16-010C-R98' not in html:
              raise SystemExit('R98 version marker missing')
          if "const show=state?.mine_choice!=='N'&&(action.shortcut?!!source&&!source.disabled:have);" in html:
              raise SystemExit('Old central-inventory visibility logic is still present')
          m = re.search(r'<script>\s*/\* R88: one workbench, four drawers, existing server-authorized actions\. \*/(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('R88 script not found')
          js = "'use strict';\n" + m.group(1)
          tmp = Path(tempfile.gettempdir()) / 'r98-r88-check.js'
          tmp.write_text(js, encoding='utf-8')
          subprocess.run(['node', '--check', str(tmp)], check=True)
          print('R98 static checks OK')
          PY

      - name: Commit patched release
        shell: bash
        run: |
          if git diff --quiet -- test-v0.1.16.html; then
            echo 'No R98 patch changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-v0.1.16.html
          git commit -m 'R98: dynamic inventory, Limbo return and coherent tool icons'
          git push origin HEAD:r98-staging
