  if(instructions){if(!instructions.classList.contains('r88-frame'))instructions.classList.add('r88-frame');if(instructions.previousElementSibling!==E('r88Toolbox'))E('r88Toolbox').insertAdjacentElement('afterend',instructions)}
  const host=E('pilotHostGroup');if(host){if(!host.classList.contains('r88-host'))host.classList.add('r88-host');const anchor=instructions||E('r88Toolbox');if(host.previousElementSibling!==anchor)anchor.insertAdjacentElement('afterend',host)}
  if(!E('r88Drawer')){
   const modal=document.createElement('div');modal.id='r88Drawer';modal.hidden=true;modal.className='r88-overlay';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-labelledby','r88DrawerTitle');
   modal.innerHTML='<div class="r88-dialog"><h2 id="r88DrawerTitle"></h2><p id="r88DrawerNote" class="r88-note"></p><div id="r88DrawerItems"></div><section id="r88ViewSettings"><h3>VISTA DEL TABLERO</h3><div class="r88-grid"><button type="button" id="r88TextView" aria-pressed="true">CON TEXTOS</button><button type="button" id="r88IconView" aria-pressed="false">CON ICONOS</button></div><p class="r88-note">Los iconos conservan el nombre de cada acción para facilitar su identificación.</p><button type="button" id="r88HelpInstructions">INSTRUCCIONES</button></section><button type="button" id="r88DrawerClose" class="r88-close">VOLVER AL TABLERO</button></div>';
   document.body.appendChild(modal);
   E('r88DrawerClose').onclick=()=>close();E('r88TextView').onclick=()=>setView('text');E('r88IconView').onclick=()=>setView('icons');
   E('r88HelpInstructions').onclick=()=>{close(false);E('pilotInstructionsBtn')?.click()};
   modal.onclick=e=>{if(e.target===modal)close()};
   modal.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();close();return}
    if(e.key!=='Tab')return;
    const focusable=[...modal.querySelectorAll('button:not(:disabled)')].filter(b=>!b.hidden&&b.getClientRects().length);
    const first=focusable[0],last=focusable.at(-1);
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
   });
  }
  return true;
 }
 function open(key,opener){
  if(!ensure())return;
  opened=key;returnFocus=opener;E('r88Drawer').hidden=false;document.body.classList.add('r88-drawer-open');
  const d=drawers.find(d=>d.key===key);setText(E('r88DrawerTitle'),d.name);setText(E('r88DrawerNote'),d.note);
  const list=E('r88DrawerItems');list.replaceChildren();
  for(const action of actions.filter(a=>a.drawer===key)){
   const card=document.createElement('article');card.className='r88-item';card.dataset.source=action.id;
   const b=button('r88Drawer_'+action.id,action.icon,action.name,()=>dispatch(action));
   if(action.danger)b.classList.add('r88-danger');
   const description=document.createElement('p');description.className='r88-description';description.textContent=action.description;
   const status=document.createElement('p');status.className='r88-availability';status.id='r88Status_'+action.id;
   b.setAttribute('aria-describedby',status.id);card.append(b,description,status);list.appendChild(card);
  }
  if(key==='medicine'){
   for(const type of ['PÓCIMA','PÍLDORA']){
    const heading=document.createElement('h3');heading.textContent=type==='PÓCIMA'?'PÓCIMAS SORTEADAS':'PÍLDORAS';list.appendChild(heading);
    for(const m of medicines.filter(m=>m.type===type)){
     const card=document.createElement('article');card.className='r88-item r88-catalogue';
     const title=document.createElement('strong');title.textContent=m.icon+' '+m.name+' · 0/1';
     const text=document.createElement('p');text.className='r88-description';text.textContent=m.description;
     const note=document.createElement('p');note.className='r88-availability';note.textContent='EN PREPARACIÓN · AÚN NO SE SORTEA';card.append(title,text,note);list.appendChild(card);
    }
   }
  }
  E('r88ViewSettings').hidden=key!=='help';sync();
  opener.setAttribute('aria-expanded','true');E('r88DrawerClose').focus();
 }
 function sync(){
  if(currentRoomMode!=='debate'||!E('debate')?.classList.contains('active')){close(false);return}
  if(!ensure())return;preference();
  E('r88Workbench').classList.toggle('r88-icons',compact);E('r88Toolbox').classList.toggle('r88-icons',compact);
  E('r88Drawer').classList.toggle('r88-icons',compact);
  let active=0;
  for(const action of actions.filter(a=>a.resource||a.board)){
   const b=E('r88Tool_'+action.id),source=E(action.id),have=owned(action);
   b.hidden=!have;if(have)active++;
   b.disabled=!source||source.disabled;iconLabel(b,action.icon,actionLabel(action));
  }
  E('r88Empty').hidden=active>0;
  E('r88ActiveTools').classList.toggle('r88-single',active===1);
  const request=E('pilotContextRequest');E('r88ContextRequest').disabled=!request||request.disabled;
  // Reading saved help is independent from initiating another decision.
  const history=E('pilotAssistantHistory');E('r88GuideHistory').disabled=!history||history.disabled;
  iconLabel(E('r88GuideHistory'),'▤',history?.textContent||'MIS AYUDAS GUARDADAS · 0/0');
  if(opened){
   for(const action of actions.filter(a=>a.drawer===opened)){
    const b=E('r88Drawer_'+action.id),card=b?.closest('.r88-item'),source=E(action.id);if(!b)continue;
    const have=(action.resource||action.board)&&owned(action);card.hidden=have;
    b.disabled=!source||source.disabled||(action.resource&&!have)||action.id==='pilotSaveSession'&&!window.dilemaBoardSnapshot?.data?.paused;
    iconLabel(b,action.icon,actionLabel(action));
    setText(E('r88Status_'+action.id),b.disabled?reason(action):'DISPONIBLE');
   }
  }
  for(const [id,on] of [['r88TextView',!compact],['r88IconView',compact]]){
   const b=E(id);b.setAttribute('aria-pressed',String(on));b.classList.toggle('selected',on);
  }
 }
 function schedule(){
  if(scheduled)return;scheduled=true;
  requestAnimationFrame(()=>{scheduled=false;if(!fullRefresh&&!(typeof r86FullRefreshPromise!=='undefined'&&r86FullRefreshPromise))sync()});
 }
 const previous=window.pilotRefresh;
 window.pilotRefresh=function(){
  if(fullRefresh)return fullRefresh;
  fullRefresh=(async()=>{try{return await previous.apply(this,arguments)}finally{sync()}})();
  fullRefresh.finally(()=>{fullRefresh=null}).catch(()=>{});return fullRefresh;
 };
 const render=window.renderDebate;
 window.renderDebate=function(){const result=render.apply(this,arguments);sync();return result};
 window.dilemaWorkbenchSync=sync;
 document.addEventListener('DOMContentLoaded',()=>{
  sync();
  const observer=new MutationObserver(records=>{
   if(records.every(r=>r.target.nodeType===1&&r.target.closest('#r88Resources,#r88Workbench,#r88Toolbox,#r88Drawer')))return;
   schedule();
  });
  observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','style','class']});
 });
})();

</script>
